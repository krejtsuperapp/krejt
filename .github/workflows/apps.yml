# KREJT — CI e aplikacioneve Flutter (§70): formatim, analizë, teste dhe APK i shkarkueshëm.
# Aplikacionet ndërtohen kundrejt të njëjtit API që përshkruan openapi.yaml.
name: apps

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/apps.yml'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - '.github/workflows/apps.yml'

# Ndërtimet e aplikacioneve janë të gjata; një push i ri e bën të vjetrin të panevojshëm.
concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  analyze:
    name: analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: pub get
        run: |
          set -euo pipefail
          for d in packages/krejt_design packages/krejt_api packages/krejt_l10n packages/krejt_map packages/krejt_push packages/krejt_screens apps/customer apps/driver; do
            (cd "$d" && flutter pub get)
          done

      - name: format
        run: dart format --output=none --set-exit-if-changed --line-length 100 apps packages

      - name: analyze
        run: |
          set -euo pipefail
          for d in packages/krejt_design packages/krejt_api packages/krejt_l10n packages/krejt_map packages/krejt_push packages/krejt_screens apps/customer apps/driver; do
            echo "== $d"
            (cd "$d" && flutter analyze)
          done

      - name: test
        run: |
          set -euo pipefail
          for d in packages/krejt_design packages/krejt_api packages/krejt_l10n packages/krejt_map packages/krejt_push packages/krejt_screens apps/customer apps/driver; do
            echo "== $d"
            # Një paketë pa teste nuk është dështim. `flutter test` del me 1 kur mungon dosja
            # `test/`, dhe kjo e ndalte gjithë punën — përfshirë ndërtimin e APK-së dhe
            # shpërndarjen te testuesit, që s'kanë asnjë lidhje me të.
            if [ -d "$d/test" ]; then
              (cd "$d" && flutter test)
            else
              echo "(pa teste)"
            fi
          done

  apk:
    name: apk (${{ matrix.app }})
    needs: analyze
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, driver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # SDK-ja e Mapbox-it nuk shkarkohet publikisht; Gradle-ja vërtetohet me një token që ka
      # vetëm të drejtën DOWNLOADS:READ. Shkruhet jashtë repo-s, te dosja e Gradle-së.
      - name: token-i i shkarkimit të Mapbox-it
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MAPBOX_DOWNLOADS_TOKEN:-}" ]; then
            echo "::error::MAPBOX_DOWNLOADS_TOKEN mungon te sekretet — pa të, Gradle nuk e shkarkon dot SDK-në."
            exit 1
          fi
          mkdir -p ~/.gradle
          printf 'MAPBOX_DOWNLOADS_TOKEN=%s\n' "$MAPBOX_DOWNLOADS_TOKEN" >> ~/.gradle/gradle.properties

      - name: pub get
        run: |
          set -euo pipefail
          for d in packages/krejt_design packages/krejt_api packages/krejt_l10n packages/krejt_map packages/krejt_push packages/krejt_screens apps/${{ matrix.app }}; do
            (cd "$d" && flutter pub get)
          done

      # APK-ja e testimit ndërtohet në debug: nuk kërkon çelës nënshkrimi dhe asnjë sekret
      # nuk hyn në repo. Ndërtimi i nënshkruar për dyqan bëhet veçmas, jashtë kësaj rrjedhe.
      - name: a ekziston çelësi publik i hartës?
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          if [ -z "${MAPBOX_PUBLIC_TOKEN:-}" ]; then
            echo "::warning::MAPBOX_PUBLIC_TOKEN mungon — kjo APK do të vizatojë skemën në vend të hartës."
          fi

      - name: build apk
        working-directory: apps/${{ matrix.app }}
        run: |
          set -euo pipefail
          # Versioni duhet të mbetet semver: serveri e krahason me min_version (§48).
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          # Token-i i hartës është publik dhe hyn brenda APK-së; pa të, ekranet e udhëtimit
          # vizatojnë skemën. Ndërtimi nuk ndalet nëse mungon, ndryshe nga ai i shkarkimit.
          flutter build apk --debug \
            --dart-define=KREJT_API_BASE_URL=${{ vars.KREJT_API_BASE_URL || 'http://10.0.2.2:8080' }} \
            --dart-define=KREJT_MAPBOX_TOKEN=${{ secrets.MAPBOX_PUBLIC_TOKEN }} \
            --dart-define=KREJT_APP_VERSION="$version"

      - uses: actions/upload-artifact@v4
        with:
          name: krejt-${{ matrix.app }}-debug-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  # Pas çdo bashkimi në main: APK release, e nënshkruar me çelësin e provës (i njëjti si te makina
  # e zhvilluesit, që versioni i ri të instalohet mbi të vjetrin), ngarkohet te Firebase App
  # Distribution. Testuesit marrin njoftim në telefon dhe e instalojnë me një prekje.
  distribute:
    name: shpërndarja (${{ matrix.app }})
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [customer, driver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: token-i i shkarkimit të Mapbox-it
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          printf 'MAPBOX_DOWNLOADS_TOKEN=%s\n' "$MAPBOX_DOWNLOADS_TOKEN" >> ~/.gradle/gradle.properties

      # Çelësi i provës: vetëm për shpërndarje testimi, jo për dyqan. Ai i dyqanit vjen më vonë, i
      # ndarë, dhe nuk kalon kurrë nga CI-ja pa vendim të pronarit.
      - name: çelësi i nënshkrimit
        env:
          KS_B64: ${{ secrets.ANDROID_TEST_KEYSTORE_B64 }}
          KS_PASSWORD: ${{ secrets.ANDROID_TEST_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p apps/keys
          printf '%s' "$KS_B64" | base64 -d > apps/keys/krejt-test.jks
          cat > apps/${{ matrix.app }}/android/key.properties <<EOF
          storeFile=../../keys/krejt-test.jks
          storePassword=$KS_PASSWORD
          keyAlias=krejt-test
          keyPassword=$KS_PASSWORD
          EOF

      - name: pub get
        run: |
          set -euo pipefail
          for d in packages/krejt_design packages/krejt_api packages/krejt_l10n packages/krejt_map packages/krejt_push packages/krejt_screens apps/${{ matrix.app }}; do
            (cd "$d" && flutter pub get)
          done

      # Çelësi publik i hartës hyn brenda APK-së. Pa të, ekranet e udhëtimit, pakos dhe porosisë
      # bien te skema dhe testuesi sheh një rrjetë në vend të hartës — defekt i heshtur, ndaj ndalemi.
      - name: çelësi publik i hartës
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MAPBOX_PUBLIC_TOKEN:-}" ]; then
            echo "::error::MAPBOX_PUBLIC_TOKEN mungon te sekretet — APK-ja do të dilte pa hartë. Vendose te Settings → Secrets and variables → Actions."
            exit 1
          fi
          case "$MAPBOX_PUBLIC_TOKEN" in
            pk.*) ;;
            *) echo "::error::MAPBOX_PUBLIC_TOKEN nuk nis me 'pk.' — duhet çelësi publik, jo ai i shkarkimit (sk.)."; exit 1 ;;
          esac

      - name: build apk (release, arm64)
        working-directory: apps/${{ matrix.app }}
        env:
          APP_ID: ${{ matrix.app == 'customer' && vars.FIREBASE_APP_ID_CUSTOMER || vars.FIREBASE_APP_ID_DRIVER }}
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          flutter build apk --release --split-per-abi --target-platform android-arm64 \
            --dart-define=KREJT_API_BASE_URL=${{ vars.KREJT_API_BASE_URL }} \
            --dart-define=KREJT_APP_VERSION="$version" \
            --dart-define=KREJT_MAPBOX_TOKEN=${{ secrets.MAPBOX_PUBLIC_TOKEN }} \
            --dart-define=KREJT_FIREBASE_API_KEY=${{ vars.KREJT_FIREBASE_API_KEY }} \
            --dart-define=KREJT_FIREBASE_APP_ID="$APP_ID" \
            --dart-define=KREJT_FIREBASE_SENDER_ID=${{ vars.KREJT_FIREBASE_SENDER_ID }} \
            --dart-define=KREJT_FIREBASE_PROJECT_ID=${{ vars.KREJT_FIREBASE_PROJECT_ID }}

      - name: ngarko te Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ matrix.app == 'customer' && vars.FIREBASE_APP_ID_CUSTOMER || vars.FIREBASE_APP_ID_DRIVER }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          testers: ${{ vars.FIREBASE_TESTERS }}
          file: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          releaseNotes: ${{ github.event.head_commit.message }}

  # iOS: përpilim i vërtetë në macOS pas çdo bashkimi në main (pa nënshkrim), që një prishje e
  # iOS-it të dalë në CI e jo në telefon. Kur të ekzistojnë llogaria Apple Developer dhe çelësi
  # App Store Connect (sekretet APPSTORE_*), i njëjti hap nënshkruan dhe ngarkon në TestFlight.
  # Minutat e macOS-it kushtojnë 10× ato të Linux-it: vetëm në main, jo në çdo PR.
  ios:
    name: iOS (${{ matrix.app }})
    needs: analyze
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        app: [customer, driver]
    steps:
      - uses: actions/checkout@v4
      # SDK-ja e Mapbox-it (v11) është ndërtuar me Swift 6.2; Xcode-i i parazgjedhur i imazhit (16.4)
      # nuk e përpilon dot. Zgjidhet Xcode-i më i ri i serisë 26 që ekziston në runner.
      - name: Xcode 26 (Swift 6.2+ për SDK-në e Mapbox-it)
        run: |
          set -euo pipefail
          latest="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # SDK-ja e Mapbox-it për iOS shkarkohet me token-in e shkarkimit përmes ~/.netrc.
      - name: token-i i shkarkimit të Mapbox-it (netrc)
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$MAPBOX_DOWNLOADS_TOKEN" ]; then echo "MAPBOX_DOWNLOADS_TOKEN mungon në secrets"; exit 1; fi
          printf 'machine api.mapbox.com\nlogin mapbox\npassword %s\n' "$MAPBOX_DOWNLOADS_TOKEN" > ~/.netrc
          chmod 600 ~/.netrc

      - name: pub get
        run: |
          set -euo pipefail
          for d in packages/krejt_design packages/krejt_api packages/krejt_l10n packages/krejt_map packages/krejt_push packages/krejt_screens apps/${{ matrix.app }}; do
            (cd "$d" && flutter pub get)
          done

      - name: a ekziston çelësi i App Store Connect?
        id: asc
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER_ID" ] && [ -n "$PRIVATE_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Pa çelës App Store Connect: vetëm përpilim, pa TestFlight."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: build ios (pa nënshkrim)
        working-directory: apps/${{ matrix.app }}
        env:
          APP_ID: ${{ matrix.app == 'customer' && vars.FIREBASE_APP_ID_CUSTOMER || vars.FIREBASE_APP_ID_DRIVER }}
        run: |
          set -euo pipefail
          version="$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)"
          flutter build ios --release --no-codesign \
            --dart-define=KREJT_API_BASE_URL=${{ vars.KREJT_API_BASE_URL }} \
            --dart-define=KREJT_APP_VERSION="$version" \
            --dart-define=KREJT_MAPBOX_TOKEN=${{ secrets.MAPBOX_PUBLIC_TOKEN }} \
            --dart-define=KREJT_FIREBASE_API_KEY=${{ vars.KREJT_FIREBASE_API_KEY }} \
            --dart-define=KREJT_FIREBASE_APP_ID="$APP_ID" \
            --dart-define=KREJT_FIREBASE_SENDER_ID=${{ vars.KREJT_FIREBASE_SENDER_ID }} \
            --dart-define=KREJT_FIREBASE_PROJECT_ID=${{ vars.KREJT_FIREBASE_PROJECT_ID }}

      # TestFlight: vetëm me llogari Apple Developer. Nënshkrimi automatik (Xcode) me çelësin e
      # App Store Connect API; ekipi (Team ID) vjen nga vars.APPLE_TEAM_ID.
      - name: ipa + TestFlight
        if: steps.asc.outputs.ready == 'true'
        working-directory: apps/${{ matrix.app }}
        env:
          KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          EOF
          flutter build ipa --release --export-options-plist=ExportOptions.plist
          xcrun altool --upload-app --type ios --file build/ios/ipa/*.ipa \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
