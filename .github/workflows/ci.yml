# KREJT — CI (§70): formatim, lint, tipe, teste njësie + integrimi, skanim sigurie/varësish, build,
# validim kontejneri, terraform fmt/validate. Asnjë deploy pa këto porta.
name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: krejt_test, POSTGRES_USER: krejt, POSTGRES_PASSWORD: krejt }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U krejt" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: formatim
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            echo "gofmt - skedare te paformatuar"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: lint (staticcheck)
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./... # 2024.1.1 nuk ndërtohet me Go 1.26
      - name: teste (njësi + integrim me Postgres dhe Redis)
        env:
          TEST_DATABASE_URL: postgres://krejt:krejt@localhost:5432/krejt_test?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: skanim varësish (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: build
        run: CGO_ENABLED=0 go build ./...
      # Çdo message_key i ri i serverit duhet të ketë përkthim në aplikacione (sq/en/de), përndryshe
      # përdoruesi sheh "Diçka shkoi keq" në vend të arsyes së vërtetë.
      - name: çelësat e gabimeve kanë përkthim
        working-directory: ${{ github.workspace }}
        run: node tests/l10n/error-keys.mjs

  container:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build api (arm64, pa push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          build-args: CMD=api
          push: false
          load: false
          tags: krejt/api:ci
      - name: skanim imazhi (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          exit-code: "1"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (asnjë sekret në repo)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.8" }
      - name: fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: validate (dev, pa backend)
        working-directory: infra/terraform/envs/dev
        run: terraform init -backend=false -input=false && terraform validate

  # Deploy në dev pas çdo bashkimi në main, vetëm kur të 4 portat kalojnë (§70). Hapat jetojnë te
  # deploy-env.yml, që staging-u dhe prod-i të përdorin saktësisht të njëjtën rrjedhë.
  deploy-dev:
    needs: [backend, container, secrets, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Workflow-i i thirrur kërkon id-token (OIDC); pa këtë leje te thirrësi, CI-ja dështon në nisje.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: dev
      name: krejt-dev
    secrets: inherit

  # Pas deploy-it: udhëtim i plotë nga API-ja me numrat e provës. Nëse rrjedha thyhet, deploy-i
  # shënohet i kuq edhe pse kontejneri u ngrit. Pa sekrete: numrat e provës punojnë vetëm në dev.
  smoke-dev:
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: udhëtim i plotë kundrejt dev-it
        run: BASE=https://dev.krejt.app node tests/e2e/ride.mjs
      - name: porosi ushqimi kundrejt dev-it
        run: BASE=https://dev.krejt.app node tests/e2e/food.mjs
      - name: pako me korrier kundrejt dev-it
        run: BASE=https://dev.krejt.app node tests/e2e/parcels.mjs

  # Staging: vetëm SHA-ja që kaloi provën e plotë në dev. Numrat e provës nuk ekzistojnë atje
  # (jashtë development serveri i refuzon), ndaj prova është shëndeti dhe versioni i shërbyer.
  deploy-staging:
    needs: [smoke-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Workflow-i i thirrur kërkon id-token (OIDC); pa këtë leje te thirrësi, CI-ja dështon në nisje.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: staging
      name: krejt-staging
    secrets: inherit

  health-staging:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: needs.deploy-staging.outputs.deployed == 'true'
    steps:
      - name: shëndeti dhe versioni në staging
        run: |
          set -euo pipefail
          base="${{ vars.KREJT_STAGING_BASE_URL || 'https://staging.krejt.app' }}"
          curl -fsS --max-time 20 "$base/healthz" && echo
          v=$(curl -fsS --max-time 20 "$base/api/v1/version")
          echo "$v"
          echo "$v" | grep -q '"version":"${{ github.sha }}"' || { echo "::error::staging s'po shërben SHA-në e këtij deploy-i"; exit 1; }

  # Prodhimi: e njëjta SHA që kaloi dev-in (prova e plotë) dhe staging-un (shëndeti). Ndizet vetëm kur
  # variabla e repo-s PROD_DEPLOY është "true" (pas ngritjes së prod-it me Terraform) dhe kalon nga
  # mjedisi "prod" i GitHub-it, ku miratimi manual vendoset si rregull mbrojtjeje (required reviewers).
  deploy-prod:
    needs: [health-staging]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PROD_DEPLOY == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
      name: krejt-prod
    secrets: inherit

  health-prod:
    runs-on: ubuntu-latest
    needs: [deploy-prod]
    if: needs.deploy-prod.outputs.deployed == 'true'
    steps:
      - name: shëndeti dhe versioni në prodhim
        run: |
          set -euo pipefail
          base="${{ vars.KREJT_PROD_BASE_URL || 'https://api.krejt.app' }}"
          curl -fsS --max-time 20 "$base/healthz" && echo
          v=$(curl -fsS --max-time 20 "$base/api/v1/version")
          echo "$v"
          echo "$v" | grep -q '"version":"${{ github.sha }}"' || { echo "::error::prod-i s'po shërben SHA-në e këtij deploy-i"; exit 1; }

  # Me dorë (workflow_dispatch): një minutë ngarkese e lehtë kundrejt dev-it me k6, që pragjet e
  # vonesës të maten rregullisht dhe jo vetëm para nisjes. Nuk ekzekutohet vetë: dev-i ka një detyrë.
  load-smoke:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: k6 smoke kundrejt dev-it
        run: k6 run -e BASE=https://dev.krejt.app -e SMOKE=1 tests/load/rides.js
