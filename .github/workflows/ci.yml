# KREJT — CI (§70): formatim, lint, tipe, teste njësie + integrimi, skanim sigurie/varësish, build,
# validim kontejneri, terraform fmt/validate. Asnjë deploy pa këto porta.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_DB: krejt_test, POSTGRES_USER: krejt, POSTGRES_PASSWORD: krejt }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U krejt" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: formatim
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            echo "gofmt - skedare te paformatuar"
            exit 1
          fi
      - name: vet
        run: go vet ./...
      - name: lint (staticcheck)
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./... # 2024.1.1 nuk ndërtohet me Go 1.26
      - name: teste (njësi + integrim me Postgres dhe Redis)
        env:
          TEST_DATABASE_URL: postgres://krejt:krejt@localhost:5432/krejt_test?sslmode=disable
          TEST_REDIS_ADDR: localhost:6379
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: skanim varësish (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: build
        run: CGO_ENABLED=0 go build ./...

  container:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build api (arm64, pa push)
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          build-args: CMD=api
          push: false
          load: false
          tags: krejt/api:ci
      - name: skanim imazhi (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: CRITICAL,HIGH
          exit-code: "1"

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (asnjë sekret në repo)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "1.15.8" }
      - name: fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: validate (dev, pa backend)
        working-directory: infra/terraform/envs/dev
        run: terraform init -backend=false -input=false && terraform validate

  # Deploy në dev pas çdo bashkimi në main, vetëm kur të 4 portat kalojnë (§70). Hyrja në AWS me OIDC
  # (roli krejt-dev-github-deploy nga Terraform); asnjë çelës i përhershëm në GitHub. Imazhet ARM64,
  # tag = SHA (repo-t ECR janë IMMUTABLE); revizion i ri task definition-i → update-service → pritje stabiliteti.
  deploy-dev:
    runs-on: ubuntu-latest
    needs: [backend, container, secrets, terraform]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: dev
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: eu-central-1
      # Terraform-i e emërton clusterin `${name}-cluster`; emri i mjedisit vetëm nuk mjafton.
      CLUSTER: krejt-dev-cluster
      DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
    steps:
      - uses: actions/checkout@v4
      - name: kontrollo konfigurimin e deploy-it
        id: cfg
        run: |
          if [ -z "$DEPLOY_ROLE_ARN" ]; then
            echo "AWS_DEPLOY_ROLE_ARN mungon në secrets të mjedisit dev — deploy-i kapërcehet (shto output-in deploy_role_arn të Terraform)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: hyrja në AWS (OIDC)
        if: steps.cfg.outputs.enabled == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: ECR login
        if: steps.cfg.outputs.enabled == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-qemu-action@v3
        if: steps.cfg.outputs.enabled == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.cfg.outputs.enabled == 'true'
      - name: build + push api (arm64)
        if: steps.cfg.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          build-args: |
            CMD=api
            APP_VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/krejt-dev/api:${{ github.sha }}
      - name: build + push worker (arm64)
        if: steps.cfg.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          build-args: |
            CMD=worker
            APP_VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/krejt-dev/worker:${{ github.sha }}
      - name: revizion i ri task definition + update-service (api, worker)
        if: steps.cfg.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          for svc in api worker; do
            image="${{ steps.ecr.outputs.registry }}/krejt-dev/${svc}:${{ github.sha }}"
            aws ecs describe-task-definition --task-definition "krejt-dev-${svc}" --query taskDefinition > td.json
            jq --arg img "$image" '.containerDefinitions[0].image = $img
              | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' td.json > td-new.json
            arn=$(aws ecs register-task-definition --cli-input-json file://td-new.json --query 'taskDefinition.taskDefinitionArn' --output text)
            echo "$svc → $arn"
            aws ecs update-service --cluster "$CLUSTER" --service "krejt-dev-${svc}" --task-definition "$arn" > /dev/null
          done
      - name: prit stabilitetin (rollback automatik nga circuit breaker nëse dështon)
        if: steps.cfg.outputs.enabled == 'true'
        run: aws ecs wait services-stable --cluster "$CLUSTER" --services krejt-dev-api krejt-dev-worker

  # Pas deploy-it: udhëtim i plotë nga API-ja me numrat e provës. Nëse rrjedha thyhet, deploy-i
  # shënohet i kuq edhe pse kontejneri u ngrit. Pa sekrete: numrat e provës punojnë vetëm në dev.
  smoke-dev:
    runs-on: ubuntu-latest
    needs: [deploy-dev]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: udhëtim i plotë kundrejt dev-it
        run: BASE=https://dev.krejt.app node tests/e2e/ride.mjs
      - name: porosi ushqimi kundrejt dev-it
        run: BASE=https://dev.krejt.app node tests/e2e/food.mjs
