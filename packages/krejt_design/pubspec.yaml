name: krejt_design
description: Sistemi i dizajnit i KREJT — tokenët, tema dhe komponentët e përbashkët (nga mockup-i).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Inter (SIL OFL 1.1, assets/fonts/LICENSE-Inter.txt): tipografia zyrtare e markës, e paketuar
  # që aplikacioni të mos varet nga rrjeti apo nga fontet e sistemit.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
