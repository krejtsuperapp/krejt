  /api/v1/admin/dispatch/live:
    get: { tags: [admin], summary: Dispatch live (udhëtimet aktive, ofertat, shoferët online, SOS), responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DispatchLive" } } } } } }
  /api/v1/admin/audit:
    get:
      tags: [admin]
      summary: Audit log (ADMIN)
      parameters: [{ name: actor_id, in: query, schema: { type: string, format: uuid } }, { name: target_id, in: query, schema: { type: string } }, { name: action, in: query, schema: { type: string } }, { $ref: "#/components/parameters/Before" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/AuditRow" } } } } } } } }
  /api/v1/admin/drivers:
    get: { tags: [admin], summary: Aplikimet e shoferëve në pritje (OPERATIONS), responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/DriverProfile" } } } } } } } } }
    post:
      tags: [admin]
      summary: Regjistro një shofer nga zyra (OPERATIONS); numri duhet të ketë hyrë një herë
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone, vehicle_make, vehicle_model, vehicle_plate, vehicle_color, categories], properties: { phone: { type: string, example: "+38344123456" }, vehicle_make: { type: string }, vehicle_model: { type: string }, vehicle_plate: { type: string }, vehicle_color: { type: string }, categories: { type: array, items: { $ref: "#/components/schemas/RideCategory" } } } } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/DriverProfile" } } } }, "404": { $ref: "#/components/responses/Err" }, "409": { $ref: "#/components/responses/Err" }, "422": { $ref: "#/components/responses/Err" } }
  /api/v1/admin/drivers/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [admin]
      summary: Mirato (kërkon dokumentet) ose pezullo shoferin (OPERATIONS)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [action], properties: { action: { type: string, enum: [approve, suspend] }, categories: { type: array, items: { $ref: "#/components/schemas/RideCategory" } }, reason: { type: string } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DriverProfile" } } } }, "422": { $ref: "#/components/responses/Err" } }
  /api/v1/admin/drivers/{id}/documents:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get: { tags: [admin], summary: Dokumentet e shoferit me URL leximi (5 min), responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DocumentsOverview" } } } } } }
  /api/v1/admin/driver-documents:
    get: { tags: [admin], summary: Dokumentet në pritje (OPERATIONS), responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Document" } } } } } } } } }
  /api/v1/admin/driver-documents/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [admin]
      summary: Approve / reject dokumentin
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [action], properties: { action: { type: string, enum: [approve, reject] }, reason: { type: string } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Document" } } } }, "404": { $ref: "#/components/responses/Err" } }
  /api/v1/admin/support/tickets:
    get:
      tags: [admin]
      summary: Radha e mbështetjes (SUPPORT/ADMIN)
      parameters: [{ name: status, in: query, schema: { type: string, enum: [open, pending_user, resolved, closed, all] } }, { name: priority, in: query, schema: { type: string, enum: [normal, high, urgent] } }, { name: assigned, in: query, schema: { type: string, enum: [me] } }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Ticket" } } } } } } } }
  /api/v1/admin/support/tickets/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get: { tags: [admin], summary: Tiketa me mesazhet dhe kontekstin (auditohet), responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Ticket" } } } } } }
    patch:
      tags: [admin]
      summary: Status / prioritet / caktim
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { status: { type: string, enum: [open, pending_user, resolved, closed] }, priority: { type: string, enum: [normal, high, urgent] }, assigned_to: { type: string, format: uuid } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Ticket" } } } } }
  /api/v1/admin/support/tickets/{id}/messages:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [admin]
      summary: Përgjigje nga Support-i (→ pending_user, push te përdoruesi)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BodyInput" } } } }
      responses: { "201": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TicketMessage" } } } } }
  /api/v1/admin/payments/intents/{id}/refund:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [admin]
      summary: Rimbursim i një mbushjeje (FINANCE; wallet-i duhet të ketë mjaftueshëm)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [amount_minor, reason], properties: { amount_minor: { type: integer }, reason: { type: string } } } } } }
      responses: { "202": { description: OK, content: { application/json: { schema: { type: object, properties: { refund_id: { type: string, format: uuid } } } } } }, "409": { $ref: "#/components/responses/Err" } }
  /api/v1/admin/risk/flags:
    get:
      tags: [admin]
      summary: "Flamujt e riskut (OPERATIONS): open | reviewing | dismissed | confirmed | all"
      parameters: [{ name: status, in: query, schema: { type: string } }, { name: user_id, in: query, schema: { type: string, format: uuid } }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/RiskFlag" } } } } } } } }
  /api/v1/admin/risk/flags/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [admin]
      summary: Zgjidh flamurin (reviewing / dismissed / confirmed)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [reviewing, dismissed, confirmed] }, note: { type: string } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RiskFlag" } } } }, "404": { $ref: "#/components/responses/Err" } }
  /api/v1/admin/users/{id}/block:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [admin]
      summary: Blloko përdoruesin (sesionet shkyçen; arsyeja e detyrueshme)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { "204": { description: OK }, "422": { $ref: "#/components/responses/Err" } }
  /api/v1/admin/users/{id}/unblock:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { tags: [admin], summary: Zhblloko përdoruesin, responses: { "204": { description: OK } } }
  /api/v1/admin/flags:
    get: { tags: [admin], summary: Feature flags (OPERATIONS), responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Flag" } } } } } } } } }
  /api/v1/admin/flags/{key}:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [admin]
      summary: Ndrysho një flag (enabled, rollout_percent, public)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { enabled: { type: boolean }, rollout_percent: { type: integer, minimum: 0, maximum: 100 }, public: { type: boolean } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Flag" } } } }, "404": { $ref: "#/components/responses/Err" } }
  /api/v1/admin/app-versions:
    get: { tags: [admin], summary: Versionet e aplikacioneve, responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/AppVersion" } } } } } } } } }
  /api/v1/admin/app-versions/{app}/{platform}:
    parameters: [{ name: app, in: path, required: true, schema: { type: string } }, { name: platform, in: path, required: true, schema: { type: string, enum: [ios, android, web] } }]
    put:
      tags: [admin]
      summary: Versioni minimal / i rekomanduar, mirëmbajtja
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { min_version: { type: string }, recommended_version: { type: string }, maintenance: { type: boolean }, maintenance_message: { type: string } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AppVersion" } } } } }

components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    Before: { name: before, in: query, schema: { type: string, format: date-time }, description: Cursor — vetëm rreshtat para kësaj kohe }
    Limit: { name: limit, in: query, schema: { type: integer } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, maxLength: 100 } }
    XAppId: { name: X-App-Id, in: header, schema: { type: string, enum: [customer, driver, partner, pro, business, admin] } }
    XAppPlatform: { name: X-App-Platform, in: header, schema: { type: string, enum: [ios, android, web] } }
    XAppVersion: { name: X-App-Version, in: header, schema: { type: string, example: "1.2.3" } }
  responses:
    Err:
      description: Gabim në zarfin e vetëm
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          required: [code, message_key, http_status, retryable]
          properties:
            code: { type: string, example: VALIDATION_FAILED }
            message_key: { type: string, example: errors.validation }
            http_status: { type: integer }
            request_id: { type: string }
            trace_id: { type: string }
            retryable: { type: boolean }
            fields: { type: object, additionalProperties: { type: string }, description: "Gabime për fushë (§57): {\"email\": \"invalid\"}" }
    Locale: { type: string, enum: [sq, en, de] }
    ServiceCategory:
      type: object
      properties: { id: { type: string }, name_key: { type: string }, sort: { type: integer } }
    ServiceProviderCard:
      type: object
      properties: { user_id: { type: string, format: uuid }, name: { type: string }, business_name: { type: [string, "null"] }, city: { type: string }, rating: { type: [number, "null"] }, rating_count: { type: integer }, jobs_done: { type: integer } }
    ServiceProvider:
      type: object
      properties: { user_id: { type: string, format: uuid }, status: { type: string, enum: [pending, approved, suspended] }, categories: { type: array, items: { type: string } }, business_name: { type: [string, "null"] }, bio: { type: [string, "null"] }, city: { type: string }, phone_public: { type: [string, "null"] }, rating: { type: [number, "null"] }, rating_count: { type: integer }, jobs_done: { type: integer }, suspended_reason: { type: [string, "null"] }, created_at: { type: string, format: date-time } }
    ServiceOffer:
      type: object
      properties: { id: { type: string, format: uuid }, request_id: { type: string, format: uuid }, provider_id: { type: string, format: uuid }, price_minor: { type: integer }, currency: { type: string }, note: { type: [string, "null"] }, can_start_at: { type: [string, "null"], format: date-time }, state: { type: string }, created_at: { type: string, format: date-time }, provider: { $ref: "#/components/schemas/ServiceProviderCard" } }
    ServiceRequestInput:
      type: object
      required: [category_id, title, description, address_line1, address, payment_method]
      properties: { category_id: { type: string }, title: { type: string, maxLength: 80 }, description: { type: string, maxLength: 1000 }, address_line1: { type: string }, address: { $ref: "#/components/schemas/Point" }, address_instructions: { type: string }, preferred_at: { type: string, format: date-time }, photo_keys: { type: array, items: { type: string }, maxItems: 5 }, payment_method: { type: string, enum: [cash, wallet] } }
    ServiceRequest:
      type: object
      properties: { id: { type: string, format: uuid }, code: { type: string }, customer_id: { type: string, format: uuid }, category_id: { type: string }, provider_id: { type: [string, "null"], format: uuid }, state: { type: string, enum: [open, booked, in_progress, completed, cancelled, no_offers] }, title: { type: string }, description: { type: string }, address_line1: { type: string }, address: { $ref: "#/components/schemas/Point" }, address_instructions: { type: [string, "null"] }, preferred_at: { type: [string, "null"], format: date-time }, photo_keys: { type: array, items: { type: string } }, payment_method: { type: string }, payment_status: { type: string }, price_minor: { type: [integer, "null"] }, currency: { type: string }, cancelled_by: { type: [string, "null"] }, cancellation_reason: { type: [string, "null"] }, created_at: { type: string, format: date-time }, booked_at: { type: [string, "null"], format: date-time }, started_at: { type: [string, "null"], format: date-time }, completed_at: { type: [string, "null"], format: date-time }, cancelled_at: { type: [string, "null"], format: date-time }, provider: { $ref: "#/components/schemas/ServiceProviderCard" }, offers: { type: array, items: { $ref: "#/components/schemas/ServiceOffer" } } }
    ServiceOpenRequest:
      type: object
      properties: { id: { type: string, format: uuid }, code: { type: string }, category_id: { type: string }, title: { type: string }, description: { type: string }, city: { type: string }, distance_m: { type: integer }, preferred_at: { type: [string, "null"], format: date-time }, photo_keys: { type: array, items: { type: string } }, created_at: { type: string, format: date-time }, my_offer: { $ref: "#/components/schemas/ServiceOffer" } }
    CouponApplied:
      type: object
      properties: { code: { type: string }, kind: { type: string, enum: [percent, fixed] }, discount_minor: { type: integer } }
    Coupon:
      type: object
      properties: { code: { type: string }, kind: { type: string, enum: [percent, fixed] }, percent_bp: { type: integer }, amount_minor: { type: integer }, min_order_minor: { type: integer }, scope: { type: string, enum: [all, food, parcels] }, starts_at: { type: [string, "null"], format: date-time }, ends_at: { type: [string, "null"], format: date-time }, max_uses: { type: [integer, "null"] }, max_uses_per_user: { type: [integer, "null"] }, uses_count: { type: integer }, active: { type: boolean }, note: { type: [string, "null"] }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } }
    CouponUpsert:
      type: object
      required: [code, kind]
      properties: { code: { type: string }, kind: { type: string, enum: [percent, fixed] }, percent_bp: { type: integer }, amount_minor: { type: integer }, min_order_minor: { type: integer }, scope: { type: string, enum: [all, food, parcels] }, starts_at: { type: string, format: date-time }, ends_at: { type: string, format: date-time }, max_uses: { type: integer }, max_uses_per_user: { type: integer }, active: { type: boolean }, note: { type: string } }
    ParcelQuote:
      type: object
      properties: { id: { type: string, format: uuid }, size: { type: string, enum: [s, m, l] }, distance_m: { type: integer }, duration_s: { type: integer }, price_minor: { type: integer }, currency: { type: string }, expires_at: { type: string, format: date-time } }
    ParcelCourier:
      type: object
      properties: { id: { type: string, format: uuid }, name: { type: string }, vehicle_make: { type: string }, vehicle_model: { type: string }, vehicle_plate: { type: string }, vehicle_color: { type: string } }
    Parcel:
      type: object
      properties: { id: { type: string, format: uuid }, code: { type: string }, pickup_code: { type: string, description: "vetëm klienti" }, delivery_code: { type: string, description: "vetëm klienti" }, customer_id: { type: string, format: uuid }, courier_id: { type: [string, "null"], format: uuid }, state: { type: string, enum: [requested, courier_assigned, picked_up, delivered, cancelled, no_courier] }, size: { type: string, enum: [s, m, l] }, payment_method: { type: string, enum: [cash, wallet] }, payment_status: { type: string }, pickup: { $ref: "#/components/schemas/Point" }, pickup_address: { type: [string, "null"] }, pickup_contact_name: { type: [string, "null"] }, pickup_contact_phone: { type: [string, "null"] }, dropoff: { $ref: "#/components/schemas/Point" }, dropoff_address: { type: [string, "null"] }, recipient_name: { type: string }, recipient_phone: { type: string }, note: { type: [string, "null"] }, distance_m: { type: integer }, duration_s: { type: integer }, price_minor: { type: integer }, discount_minor: { type: integer }, coupon_code: { type: [string, "null"] }, currency: { type: string }, cancelled_by: { type: [string, "null"] }, cancellation_reason: { type: [string, "null"] }, created_at: { type: string, format: date-time }, assigned_at: { type: [string, "null"], format: date-time }, picked_up_at: { type: [string, "null"], format: date-time }, delivered_at: { type: [string, "null"], format: date-time }, cancelled_at: { type: [string, "null"], format: date-time }, courier: { $ref: "#/components/schemas/ParcelCourier" } }
    ParcelOffer:
      type: object
      properties: { id: { type: string, format: uuid }, parcel_id: { type: string, format: uuid }, code: { type: string }, round: { type: integer }, expires_at: { type: string, format: date-time }, distance_m: { type: integer }, eta_s: { type: integer }, size: { type: string }, pickup_address: { type: [string, "null"] }, pickup: { $ref: "#/components/schemas/Point" }, dropoff_address: { type: [string, "null"] }, dropoff: { $ref: "#/components/schemas/Point" }, route_m: { type: integer }, earnings_minor: { type: integer }, currency: { type: string }, payment_method: { type: string }, total_minor: { type: integer } }
    Place:
      type: object
      properties:
        name: { type: string }
        address: { type: string }
        kind: { type: string, description: "address | street | poi | place | locality | neighborhood" }
        point: { $ref: "#/components/schemas/Point" }
    RoutePath:
      type: object
      properties:
        distance_m: { type: integer }
        duration_s: { type: integer }
        path: { type: array, items: { $ref: "#/components/schemas/Point" }, description: "Gjeometria e rrugës, lat/lng me radhë" }
    Point: { type: object, required: [lat, lng], properties: { lat: { type: number }, lng: { type: number } } }
    RideCategory: { type: string, enum: [economy, comfort, xl, taxi] }
    RideState: { type: string, enum: [matching, assigned, arrived, in_progress, completed, cancelled, no_driver] }
    TokenPair:
      type: object
      properties: { access_token: { type: string }, refresh_token: { type: string }, expires_at: { type: string, format: date-time }, user_id: { type: string, format: uuid }, is_new_user: { type: boolean } }
    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        phone: { type: string }
        email: { type: [string, "null"] }
        full_name: { type: [string, "null"] }
        locale: { $ref: "#/components/schemas/Locale" }
        capabilities: { type: array, items: { type: string } }
        wallet: { type: object, properties: { balance_minor: { type: integer }, currency: { type: string }, closed_loop: { type: boolean } } }
        photo_url: { type: [string, "null"], description: "URL publike e fotos së profilit (CloudFront); null pa foto" }
        created_at: { type: string, format: date-time }
    Profile:
      type: object
      properties: { id: { type: string, format: uuid }, phone: { type: [string, "null"] }, email: { type: [string, "null"] }, full_name: { type: [string, "null"] }, locale: { $ref: "#/components/schemas/Locale" }, updated_at: { type: string, format: date-time } }
    AddressInput:
      type: object
      required: [label, line1, city, lat, lng]
      properties:
        label: { type: string, enum: [home, work, other] }
        name: { type: string, maxLength: 40 }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        postal_code: { type: string }
        lat: { type: number }
        lng: { type: number }
        place_id: { type: string }
        instructions: { type: string, maxLength: 200 }
        is_default: { type: boolean }
    Address:
      allOf:
        - $ref: "#/components/schemas/AddressInput"
        - type: object
          properties: { id: { type: string, format: uuid }, created_at: { type: string, format: date-time }, updated_at: { type: string, format: date-time } }
    DataExport:
      type: object
      properties: { id: { type: string, format: uuid }, status: { type: string, enum: [none, pending, building, ready, failed, expired] }, requested_at: { type: string, format: date-time }, completed_at: { type: [string, "null"], format: date-time }, expires_at: { type: [string, "null"], format: date-time }, size_bytes: { type: [integer, "null"] }, download_url: { type: string } }
    Preference:
      type: object
      required: [category]
      properties: { category: { type: string, enum: [security, rides, orders, payments, wallet, loyalty, promotions, support] }, push: { type: boolean }, email: { type: boolean }, sms: { type: boolean } }
    Session:
      type: object
      properties: { id: { type: string, format: uuid }, device_name: { type: [string, "null"] }, platform: { type: [string, "null"] }, ip: { type: [string, "null"] }, last_seen_at: { type: string, format: date-time }, created_at: { type: string, format: date-time }, current: { type: boolean } }
    Notification:
      type: object
      properties: { id: { type: string, format: uuid }, category: { type: string }, title_key: { type: string }, body_key: { type: string }, params: { type: object, additionalProperties: { type: string } }, deep_link: { type: [string, "null"] }, read_at: { type: [string, "null"], format: date-time }, created_at: { type: string, format: date-time } }
    RealtimeToken:
      type: object
      properties: { token: { type: string }, expires_at: { type: string, format: date-time }, channel: { type: string } }
    QuoteResult:
      type: object
      properties:
        area: { type: object, properties: { id: { type: string }, name: { type: string }, center: { $ref: "#/components/schemas/Point" }, radius_km: { type: number } } }
        distance_m: { type: integer }
        duration_s: { type: integer }
        quotes:
          type: array
          items:
            type: object
            properties: { id: { type: string, format: uuid }, category: { $ref: "#/components/schemas/RideCategory" }, seats: { type: integer }, price_minor: { type: integer }, currency: { type: string }, surge_bp: { type: integer }, pickup_eta_s: { type: [integer, "null"] }, expires_at: { type: string, format: date-time } }
