openapi: 3.1.0
info:
  title: KREJT API
  version: "1.0"
  description: |
    API-ja e KREJT Super App (Kosovë, V1). Serveri është autoritar: klienti nuk dërgon kurrë çmim, bilanc,
    rol apo status. Të gjitha shumat janë numra të plotë në cent (`*_minor`) me `currency` (EUR).
    Gabimet kthehen gjithmonë në zarfin `Error` (code, message_key, http_status, request_id, trace_id, retryable, fields).
    Header-at e klientit: `X-App-Id` (customer|driver|partner|pro|business|admin), `X-App-Platform` (ios|android|web),
    `X-App-Version` (semver) — porta e versionit kthen 426 UPDATE_REQUIRED ose 503 MAINTENANCE.
    Kufizim shpejtësie: 300/min për IP, 600/min për përdorues (429 me Retry-After).
servers:
  - url: https://api.krejt.app
  - url: http://localhost:8080
security:
  - bearerAuth: []
tags:
  - name: system
  - name: config
  - name: auth
  - name: users
  - name: notifications
  - name: realtime
  - name: rides
  - name: chat
  - name: reviews
  - name: driver
  - name: documents
  - name: media
  - name: places
  - name: parcels
  - name: promos
  - name: services
  - name: wallet
  - name: payments
  - name: support
  - name: merchants
  - name: orders
  - name: admin
paths:
  /healthz:
    get: { tags: [system], security: [], summary: Liveness, responses: { "200": { description: OK } } }
  /readyz:
    get: { tags: [system], security: [], summary: Readiness (DB + Redis), responses: { "200": { description: OK }, "503": { $ref: "#/components/responses/Err" } } }
  /api/v1/version:
    get:
      tags: [system]
      security: []
      summary: Versioni i shërbimit
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, properties: { service: { type: string }, env: { type: string }, version: { type: string }, region: { type: string } } } } } }
  /legal/{doc}:
    get:
      tags: [system]
      security: []
      summary: Kushtet ose Politika e privatësisë si faqe HTML (adresa publike për dyqanet e aplikacioneve)
      parameters:
        - { name: doc, in: path, required: true, schema: { type: string, enum: [terms, privacy] } }
        - { name: lang, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
      responses: { "200": { description: OK, content: { text/html: { schema: { type: string } } } }, "404": { description: Dokument i panjohur }, "503": { description: Identiteti i operatorit nuk është konfiguruar } }
  /api/v1/legal/{doc}:
    get:
      tags: [system]
      security: []
      summary: I njëjti dokument i strukturuar, për ekranin brenda aplikacionit
      parameters:
        - { name: doc, in: path, required: true, schema: { type: string, enum: [terms, privacy] } }
        - { name: lang, in: query, required: false, schema: { $ref: "#/components/schemas/Locale" } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LegalDocument" } } } }
        "404": { $ref: "#/components/responses/Err" }
        "503": { $ref: "#/components/responses/Err" }
  /api/v1/openapi.yaml:
    get: { tags: [system], security: [], summary: Ky specifikim (YAML), responses: { "200": { description: OK } } }
  /api/v1/config:
    get:
      tags: [config]
      security: [{}, { bearerAuth: [] }]
      summary: Konfigurimi i klientit (versionet, mirëmbajtja, flag-et publike)
      parameters: [{ $ref: "#/components/parameters/XAppId" }, { $ref: "#/components/parameters/XAppPlatform" }, { $ref: "#/components/parameters/XAppVersion" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/PublicConfig" } } } }

  /api/v1/auth/otp/request:
    post:
      tags: [auth]
      security: []
      summary: Kërko kod OTP (SMS)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone], properties: { phone: { type: string, example: "+38344123456" }, locale: { $ref: "#/components/schemas/Locale" } } } } } }
      responses: { "204": { description: Kodi u dërgua }, "422": { $ref: "#/components/responses/Err" }, "429": { $ref: "#/components/responses/Err" } }
  /api/v1/auth/otp/verify:
    post:
      tags: [auth]
      security: []
      summary: Verifiko OTP → access + refresh token (krijon përdoruesin nëse s'ekziston)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone, code, device], properties: { phone: { type: string }, code: { type: string }, locale: { $ref: "#/components/schemas/Locale" }, device: { type: object, required: [id, platform], properties: { id: { type: string }, name: { type: string }, platform: { type: string, enum: [ios, android, web] } } } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } } }, "401": { $ref: "#/components/responses/Err" } }
  /api/v1/auth/token/refresh:
    post:
      tags: [auth]
      security: []
      summary: Rotacion i refresh token-it (i vjetri bëhet i pavlefshëm)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/TokenPair" } } } }, "401": { $ref: "#/components/responses/Err" } }
  /api/v1/auth/logout:
    post: { tags: [auth], summary: Shkyçje e sesionit aktual, responses: { "204": { description: OK } } }
  /api/v1/auth/logout-all:
    post: { tags: [auth], summary: Shkyçje e të gjitha sesioneve, responses: { "204": { description: OK } } }

  /api/v1/users/me:
    get:
      tags: [users]
      summary: Profili + kapacitetet + wallet-i
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } } }
    patch:
      tags: [users]
      summary: Ndrysho emrin / emailin / gjuhën ("" pastron emrin ose emailin)
      requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { full_name: { type: string }, email: { type: string }, locale: { $ref: "#/components/schemas/Locale" } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Profile" } } } }, "409": { $ref: "#/components/responses/Err" }, "422": { $ref: "#/components/responses/Err" } }
    delete:
      tags: [users]
      summary: Fshi llogarinë (anonimizim; wallet-i duhet 0 — WALLET_NOT_EMPTY)
      responses: { "204": { description: OK }, "409": { $ref: "#/components/responses/Err" } }
  /api/v1/users/me/addresses:
    get: { tags: [users], summary: Adresat e ruajtura, responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Address" } }, max: { type: integer } } } } } } } }
    post:
      tags: [users]
      summary: Shto adresë (vetëm brenda Kosovës — ADDRESS_OUTSIDE_KOSOVO)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddressInput" } } } }
      responses: { "201": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } }, "422": { $ref: "#/components/responses/Err" } }
  /api/v1/users/me/addresses/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [users]
      summary: Ndrysho adresën
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddressInput" } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } }, "404": { $ref: "#/components/responses/Err" } }
    delete: { tags: [users], summary: Fshi adresën, responses: { "204": { description: OK }, "404": { $ref: "#/components/responses/Err" } } }
  /api/v1/users/me/export:
    post:
      tags: [users]
      summary: "Kërko eksportin e të dhënave personale (një në 24 h; ndërtohet nga worker-i)"
      responses: { "202": { description: Kërkesa u pranua, content: { application/json: { schema: { $ref: "#/components/schemas/DataExport" } } } }, "409": { $ref: "#/components/responses/Err" }, "429": { $ref: "#/components/responses/Err" } }
    get:
      tags: [users]
      summary: "Gjendja e eksportit të fundit; download_url vetëm kur është gati (URL e nënshkruar, 10 min)"
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/DataExport" } } } } }
  /api/v1/users/me/notification-preferences:
    get: { tags: [users], summary: Preferencat e njoftimeve (8 kategori), responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Preference" } } } } } } } } }
    put:
      tags: [users]
      summary: Ruaj preferencat (security.push nuk çaktivizohet)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/Preference" } } } } } } }
      responses: { "200": { description: OK }, "422": { $ref: "#/components/responses/Err" } }
  /api/v1/users/me/sessions:
    get: { tags: [users], summary: Pajisjet e kyçura, responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Session" } } } } } } } } }
  /api/v1/users/me/sessions/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    delete: { tags: [users], summary: Shkyç një pajisje, responses: { "204": { description: OK }, "404": { $ref: "#/components/responses/Err" } } }

  /api/v1/notifications:
    get:
      tags: [notifications]
      summary: Kutia e njoftimeve
      parameters: [{ $ref: "#/components/parameters/Before" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Notification" } }, unread: { type: integer } } } } } } }
  /api/v1/notifications/read-all:
    post: { tags: [notifications], summary: Shëno të gjitha si të lexuara, responses: { "204": { description: OK } } }
  /api/v1/notifications/{id}/read:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { tags: [notifications], summary: Shëno një njoftim si të lexuar, responses: { "204": { description: OK }, "404": { $ref: "#/components/responses/Err" } } }
  /api/v1/notifications/push-token:
    post:
      tags: [notifications]
      summary: Regjistro / rifresko token-in FCM të pajisjes
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [platform, token], properties: { platform: { type: string, enum: [ios, android, web] }, token: { type: string }, locale: { $ref: "#/components/schemas/Locale" } } } } } }
      responses: { "204": { description: OK }, "422": { $ref: "#/components/responses/Err" } }
    delete:
      tags: [notifications]
      summary: Çregjistro token-in (dalje nga pajisja)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses: { "204": { description: OK } }

  /api/v1/realtime/token:
    post: { tags: [realtime], summary: Token lidhjeje për Centrifugo (1 h), responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RealtimeToken" } } } } } }
  /api/v1/realtime/subscribe:
    post:
      tags: [realtime]
      summary: Token abonimi për kanal (ride:{id} | driver:{id} | user:{id} | ops:{id} — autorizim server-side)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [channel], properties: { channel: { type: string, example: "ride:6f1c…" } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RealtimeToken" } } } }, "403": { $ref: "#/components/responses/Err" } }

  /api/v1/services/categories:
    get: { tags: [services], summary: Kategoritë e shërbimeve, responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ServiceCategory" } } } } } } } } }
  /api/v1/services/requests:
    post:
      tags: [services]
      summary: Kërkesë e re shërbimi (Idempotency-Key i detyrueshëm)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceRequestInput" } } } }
      responses: { "201": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceRequest" } } } }, "422": { $ref: "#/components/responses/Err" } }
    get:
      tags: [services]
      summary: Kërkesat e klientit
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ServiceRequest" } } } } } } } }
  /api/v1/services/requests/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get: { tags: [services], summary: "Kërkesa (klienti e sheh me ofertat derisa zgjedh)", responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceRequest" } } } }, "404": { $ref: "#/components/responses/Err" } } }
  /api/v1/services/requests/{id}/accept:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [services]
      summary: Pranon një ofertë (kërkesa bëhet e rezervuar)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [offer_id], properties: { offer_id: { type: string, format: uuid } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceRequest" } } } }, "402": { $ref: "#/components/responses/Err" }, "409": { $ref: "#/components/responses/Err" } }
  /api/v1/services/requests/{id}/cancel:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [services]
      summary: Anulon kërkesën (para se puna të nisë)
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 200 } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceRequest" } } } }, "409": { $ref: "#/components/responses/Err" } }
  /api/v1/services/provider:
    post:
      tags: [services]
      summary: Apliko si mjeshtër (miratimi nga OPERATIONS)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [categories, city], properties: { categories: { type: array, items: { type: string } }, business_name: { type: string }, bio: { type: string }, city: { type: string }, phone_public: { type: string } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceProvider" } } } }, "422": { $ref: "#/components/responses/Err" } }
    get: { tags: [services], summary: Profili i mjeshtrit, responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceProvider" } } } }, "404": { $ref: "#/components/responses/Err" } } }
  /api/v1/services/provider/open:
    get:
      tags: [services]
      summary: "Punët e hapura në kategoritë e mjeshtrit (pa adresë të saktë derisa oferta pranohet)"
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ServiceOpenRequest" } } } } } } }, "403": { $ref: "#/components/responses/Err" } }
  /api/v1/services/provider/jobs:
    get:
      tags: [services]
      summary: Punët e mjeshtrit
      parameters: [{ $ref: "#/components/parameters/Limit" }]
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ServiceRequest" } } } } } } } }
  /api/v1/services/provider/requests/{id}/offer:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [services]
      summary: Dërgo ose përditëso ofertën
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [price_minor], properties: { price_minor: { type: integer }, note: { type: string, maxLength: 300 }, can_start_at: { type: string, format: date-time } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceOffer" } } } }, "403": { $ref: "#/components/responses/Err" }, "409": { $ref: "#/components/responses/Err" } }
  /api/v1/services/provider/offers/{id}/withdraw:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { tags: [services], summary: Tërhiq ofertën, responses: { "204": { description: OK }, "404": { $ref: "#/components/responses/Err" } } }
  /api/v1/services/provider/requests/{id}/start:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { tags: [services], summary: Puna nisi, responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceRequest" } } } }, "409": { $ref: "#/components/responses/Err" } } }
  /api/v1/services/provider/requests/{id}/complete:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post: { tags: [services], summary: Puna përfundoi (shlyerja në ledger), responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceRequest" } } } }, "409": { $ref: "#/components/responses/Err" } } }
  /api/v1/services/provider/requests/{id}/release:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [services]
      summary: Mjeshtri heq dorë para nisjes (kërkesa kthehet e hapur)
      requestBody: { content: { application/json: { schema: { type: object, properties: { reason: { type: string, maxLength: 200 } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceRequest" } } } }, "409": { $ref: "#/components/responses/Err" } }
  /api/v1/admin/service-providers:
    get:
      tags: [services]
      summary: Mjeshtrit për shqyrtim (OPERATIONS); aplikimet e reja të parat
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, suspended] } }
        - { $ref: "#/components/parameters/Limit" }
      responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/ServiceProvider" } } } } } } } }
  /api/v1/admin/service-providers/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      tags: [services]
      summary: Mirato ose pezullo një mjeshtër (OPERATIONS)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [pending, approved, suspended] }, reason: { type: string, maxLength: 200 } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceProvider" } } } }, "404": { $ref: "#/components/responses/Err" } }
  /api/v1/coupons/check:
    post:
      tags: [promos]
      summary: Kontrollo një kupon para checkout-it (zbritja llogaritet në server)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code, scope, amount_minor], properties: { code: { type: string }, scope: { type: string, enum: [food, parcels] }, amount_minor: { type: integer } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/CouponApplied" } } } }, "422": { $ref: "#/components/responses/Err" } }
  /api/v1/admin/coupons:
    get: { tags: [promos], summary: Lista e kuponave (OPERATIONS), parameters: [{ $ref: "#/components/parameters/Limit" }], responses: { "200": { description: OK, content: { application/json: { schema: { type: object, properties: { items: { type: array, items: { $ref: "#/components/schemas/Coupon" } } } } } } } } }
    post:
      tags: [promos]
      summary: Krijo ose përditëso një kupon (OPERATIONS)
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CouponUpsert" } } } }
      responses: { "201": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Coupon" } } } }, "422": { $ref: "#/components/responses/Err" } }
  /api/v1/admin/coupons/{code}:
    parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
    patch:
      tags: [promos]
      summary: Ndiz/fik një kupon (OPERATIONS)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [active], properties: { active: { type: boolean } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Coupon" } } } }, "404": { $ref: "#/components/responses/Err" } }
  /api/v1/parcels/quote:
    post:
      tags: [parcels]
      summary: Çmimi i një pakoje (server-side, afat 2 min)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [size, pickup, dropoff], properties: { size: { type: string, enum: [s, m, l] }, pickup: { $ref: "#/components/schemas/Point" }, pickup_address: { type: string }, dropoff: { $ref: "#/components/schemas/Point" }, dropoff_address: { type: string } } } } } }
      responses: { "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ParcelQuote" } } } }, "422": { $ref: "#/components/responses/Err" }, "503": { $ref: "#/components/responses/Err" } }
  /api/v1/parcels:
    post:
      tags: [parcels]
      summary: Krijo dërgesë pakoje nga një quote (Idempotency-Key i detyrueshëm)
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [quote_id, payment_method, recipient_name, recipient_phone], properties: { quote_id: { type: string, format: uuid }, payment_method: { type: string, enum: [cash, wallet] }, pickup_contact_name: { type: string }, pickup_contact_phone: { type: string }, recipient_name: { type: string }, recipient_phone: { type: string }, note: { type: string, maxLength: 300 }, coupon_code: { type: string } } } } } }
